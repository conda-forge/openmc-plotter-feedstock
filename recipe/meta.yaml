{% set name = "openmc-plotter" %}
{% set version = "0.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 1eb558afdb57c024df05f3a291bc7cbc5778707a8b8ecd6f5ca7c792f0b57df3
build:
  entry_points:
    - openmc-plotter=openmc_plotter.__main__:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  noarch: python

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=80
    - setuptools-scm >=8
    - wheel
  run:
    - matplotlib-base
    - numpy
    - openmc >=0.16.0
    - pyside6
    - python >={{ python_min }}

test:
  imports:
    - openmc_plotter
  commands:
    - pip check
    - python -c "import openmc_plotter; assert openmc_plotter.__version__ == '{{ version }}'"
    - python -c "from openmc.lib import slice_data, slice_data_overlap_info"
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/openmc-dev/plotter
  summary: Plotting tool for OpenMC models and tally data
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kkiesling
    - paulromano
    - pshriwise
